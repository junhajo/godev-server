services:
  godev-server:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: docker.io/junhajo/godev-server:${GO_VERSION}
    container_name: godev-server
    hostname: godev-server-ubuntu-22045
    volumes:
      - ~/container/godev-server/home:/home
      - ~/container/godev-server/go:/go
    ports:
      - "${HOST_PORT}:22"
    privileged: true
    restart: always
    environment:
      - TZ=Asia/Seoul
    networks:
      godev-network:
        aliases:
          - godev
    depends_on:
      - mongodb
      - redis

  mongodb:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port ${MONGODB_PORT}
    expose:
      - "${MONGODB_PORT}"
    volumes:
      - ~/container/mongodb/data/db:/data/db
    restart: always
    networks:
      godev-network:
        aliases:
          - mongodb

  redis:
    container_name: redis
    image: redis:7.2-alpine
    command: redis-server --port ${REDIS_PORT}
    expose:
      - "${REDIS_PORT}"
    volumes:
      - ~/container/redis/data:/data
    restart: always
    networks:
      godev-network:
        aliases:
          - redis

networks:
  godev-network:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-godev
