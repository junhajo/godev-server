services:
  godev-server:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: docker.io/junhajo/godev-server:${GO_VERSION}
    container_name: godev-container
    hostname: godev-server
    volumes:
    - ~/container/godev-server/home:/home
    - ~/container/godev-server/go:/go
    ports:
    - "${HOST_PORT}:22"
    privileged: true
    restart: always
    environment:
    - TZ=Asia/Seoul
